<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rubik 26 Cubies</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
    .interaction-panel {
      position: absolute;
      left: 20px;
      top: 20px;
      display: grid;
      gap: 6px;
      max-width: min(340px, calc(100vw - 40px));
      padding: 14px 16px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 14px;
      background: rgba(8,10,13,.78);
      backdrop-filter: blur(10px);
      color: #e8ebef;
      font-size: 13px;
      line-height: 1.4;
    }
    .interaction-panel strong { font-size: 15px; }
    .interaction-panel .controls { display: flex; gap: 8px; margin-top: 4px; }
    .interaction-panel button { border: 1px solid rgba(255,255,255,.16); border-radius: 9px; background: rgba(255,255,255,.08); color: inherit; padding: 7px 12px; font: inherit; font-weight: 700; cursor: pointer; }
    .interaction-panel button:hover:not(:disabled) { background: rgba(255,255,255,.14); }
    .interaction-panel button:disabled { opacity: .45; cursor: default; }
    .interaction-panel .status { opacity: .82; }
    @media (max-width: 640px) {
      .interaction-panel { left: 12px; top: 12px; }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Interactive 3D Rubik cube">
    <div id="cube" class="cube-viewport"></div>
    <aside class="interaction-panel">
      <strong>Interactive Rubik</strong>
      <span>Drag any sticker on a center, edge, or corner; the selected layer follows your drag.</span>
      <span>Release after roughly half a turn to snap 90°; release earlier to return.</span>
      <span>Drag empty space to rotate the Rubik itself.</span>
      <span>Wheel / touchpad = zoom.</span>
      <div class="controls"><button id="play-button" type="button">Play</button></div>
      <span id="status" class="status" aria-live="polite">Ready</span>
    </aside>
  </main>

  <script>
    window.__rubikBooted = false;
    window.setTimeout(() => {
      if (window.__rubikBooted) return;
      const status = document.querySelector('#status');
      if (status) {
        status.textContent = 'Preview gagal memuat modul 3D. Jalankan lewat HTTP server.';
        status.dataset.error = 'true';
      }
    }, 4000);
  </script>

  <script type="module">
    import { createSolvedCube } from './src/core/cube.js';
    import { CubeTurnRuntime } from './src/animation/cube-turn-runtime.js';
    import { RubikRenderer } from './src/render/cube-renderer.js';
    import { TurnRenderAdapter } from './src/render/turn-renderer.js';
    import { ManualInteractionController } from './src/interaction/manual-controller.js';
    import { ShuffleController, SHUFFLE_STATES } from './src/animation/shuffle-controller.js';

    const renderer = new RubikRenderer(document.querySelector('#cube'));
    window.__rubikBooted = true;
    const adapter = new TurnRenderAdapter(renderer);
    const runtime = new CubeTurnRuntime({
      cubeState: createSolvedCube(),
      adapter,
      renderer
    });

    renderer.renderCube(runtime.cubeState);

    const status = document.querySelector('#status');

    const interaction = new ManualInteractionController({
      domElement: renderer.renderer.domElement,
      cameraController: renderer.cameraController,
      cubeOrientationController: renderer.cubeOrientationController,
      pickFace: (x, y) => renderer.pickFace(x, y),
      beginInteractive: move => runtime.beginInteractive(move),
      updateInteractive: progress => runtime.updateInteractive(progress),
      endInteractive: options => runtime.endInteractive(options),
      isInputLocked: () => runtime.busy,
      onGesture: event => {
        if (event.type === 'face-drag') {
          status.textContent = `Layer ${event.turn.axis.toUpperCase()}${event.turn.layer > 0 ? '+' : event.turn.layer < 0 ? '-' : '0'} • ${Math.round(event.progress * 90)}°`;
        } else if (event.type === 'cube-rotate') {
          status.textContent = 'Cube rotation';
        }
      }
    });

    const playButton = document.querySelector('#play-button');
    const shuffle = new ShuffleController({
      runtime,
      interaction,
      onStateChange: state => {
        if (state === SHUFFLE_STATES.SCRAMBLING) {
          playButton.disabled = true;
          playButton.textContent = 'Scrambling…';
        } else if (state === SHUFFLE_STATES.PLAYING) {
          playButton.disabled = true;
          playButton.textContent = 'Playing';
          status.textContent = 'Ready to solve';
        } else {
          playButton.disabled = false;
          playButton.textContent = 'Play';
        }
      },
      onProgress: ({ completed, total }) => {
        if (shuffle.state === SHUFFLE_STATES.SCRAMBLING) {
          status.textContent = `Scrambling ${completed}/${total}`;
        }
      }
    });

    playButton.addEventListener('click', () => {
      if (!shuffle.play()) return;
    });

    // Use the requestAnimationFrame timestamp for both sides of the delta.
    // Mixing performance.now() with the RAF timestamp can produce a negative
    // delta in browser previews/embedded documents and stop the render loop.
    let previous = null;
    function frame(now) {
      const rawDelta = previous === null ? 0 : now - previous;
      const delta = Math.min(50, Math.max(0, Number.isFinite(rawDelta) ? rawDelta : 0));
      previous = now;
      const result = runtime.tick(delta);
      shuffle.handleTick(result);
      renderer.renderFrame();
      if (shuffle.state === SHUFFLE_STATES.SCRAMBLING) {
        // ShuffleController owns the progress/status text while scrambling.
      } else if (result.completed) {
        status.textContent = `Turn complete: layer ${result.completed.axis.toUpperCase()}${result.completed.layer > 0 ? '+' : result.completed.layer < 0 ? '-' : '0'}`;
      } else if (shuffle.state === SHUFFLE_STATES.IDLE && !runtime.busy) {
        status.textContent = 'Ready';
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    window.addEventListener('beforeunload', () => {
      interaction.dispose();
      renderer.dispose();
    });
  </script>
</body>
</html>
