<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rubik 26 Cubies — Phase 3 Animation Preview</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="stage" aria-label="Rubik phase 3 animation preview">
    <div id="cube" class="cube-viewport"></div>
    <aside class="debug-panel">
      <strong>Phase 3</strong>
      <span id="status">Animation preview</span>
      <span>Automatic legal face turns</span>
    </aside>
  </main>
  <script type="module">
    import { createSolvedCube } from '../src/core/cube.js';
    import { RubikRenderer } from '../src/render/cube-renderer.js';
    import { FaceTurnAnimator } from '../src/animation/face-turn-animator.js';
    import { CubeTurnRuntime } from '../src/animation/cube-turn-runtime.js';
    import { FaceTurnRenderAdapter } from '../src/render/face-turn-renderer.js';

    const renderer = new RubikRenderer(document.querySelector('#cube'));
    const adapter = new FaceTurnRenderAdapter(renderer);
    const runtime = new CubeTurnRuntime({
      cubeState: createSolvedCube(),
      animator: new FaceTurnAnimator({ durationMs: 420 }),
      adapter,
      renderer
    });
    renderer.renderCube(runtime.cubeState);

    const sequence = ['R', 'U', "R'", "U'", 'F2', 'D'];
    runtime.enqueue(...sequence);
    const status = document.querySelector('#status');
    let last = performance.now();
    let cycles = 0;

    function frame(now) {
      const delta = Math.min(50, now - last);
      last = now;
      runtime.tick(delta);
      status.textContent = runtime.busy ? `Animating • queued ${runtime.animator.queuedCount}` : 'Sequence complete';
      if (runtime.busy) requestAnimationFrame(frame);
      else if (cycles < 1) {
        cycles += 1;
        setTimeout(() => {
          runtime.enqueue(...sequence);
          last = performance.now();
          requestAnimationFrame(frame);
        }, 700);
      }
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
