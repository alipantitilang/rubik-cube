<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rubik 26 Cubies — Phase 4 Camera Preview</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
    .camera-controls { position:absolute; right:20px; bottom:20px; display:grid; gap:8px; width:min(260px, calc(100vw - 40px)); padding:14px; border:1px solid rgba(255,255,255,.12); border-radius:14px; background:rgba(8,10,13,.78); backdrop-filter:blur(10px); color:#e8ebef; }
    .camera-controls .row { display:flex; gap:8px; }
    .camera-controls button { flex:1; min-height:38px; border:1px solid rgba(255,255,255,.14); border-radius:9px; background:rgba(255,255,255,.07); color:inherit; cursor:pointer; }
    .camera-controls button:hover { background:rgba(255,255,255,.12); }
    .camera-controls label { display:grid; gap:6px; font-size:12px; }
    .camera-controls input { width:100%; }
    @media (max-width:640px) { .camera-controls { right:12px; bottom:12px; } }
  </style>
</head>
<body>
  <main class="stage" aria-label="Rubik phase 4 camera preview">
    <div id="cube" class="cube-viewport"></div>
    <aside class="debug-panel"><strong>Phase 4</strong><span id="status">Camera controls ready</span><span>Drag = orbit • Wheel = zoom</span></aside>
    <section class="camera-controls" aria-label="Camera controls">
      <div class="row"><button id="left" type="button" aria-label="Rotate view left">Rotate ←</button><button id="right" type="button" aria-label="Rotate view right">Rotate →</button></div>
      <div class="row"><button id="up" type="button">Rotate ↑</button><button id="down" type="button">Rotate ↓</button></div>
      <label>Zoom <input id="zoom" type="range" min="0" max="100" value="50" aria-label="Camera zoom"></label>
      <button id="reset" type="button">Reset View</button>
    </section>
  </main>
  <script type="module">
    import { createSolvedCube } from '../src/core/cube.js';
    import { RubikRenderer } from '../src/render/cube-renderer.js';

    const renderer = new RubikRenderer(document.querySelector('#cube'));
    renderer.renderCube(createSolvedCube());
    const camera = renderer.cameraController;
    const status = document.querySelector('#status');
    const zoom = document.querySelector('#zoom');

    const sync = () => {
      zoom.value = String(Math.round(camera.getZoomPercent()));
      status.textContent = `Yaw ${camera.state.yaw.toFixed(2)} • Pitch ${camera.state.pitch.toFixed(2)} • Zoom ${Math.round(camera.getZoomPercent())}%`;
    };
    document.querySelector('#left').onclick = () => { camera.rotateByDegrees(-20); sync(); };
    document.querySelector('#right').onclick = () => { camera.rotateByDegrees(20); sync(); };
    document.querySelector('#up').onclick = () => { camera.rotateByDegrees(0, 12); sync(); };
    document.querySelector('#down').onclick = () => { camera.rotateByDegrees(0, -12); sync(); };
    document.querySelector('#reset').onclick = () => { camera.reset(); sync(); };
    zoom.oninput = () => { camera.setZoomPercent(zoom.value); sync(); };
    sync();
  </script>
</body>
</html>
