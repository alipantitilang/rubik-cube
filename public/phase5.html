<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rubik 26 Cubies — Phase 5 Manual Interaction</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
    .phase5-panel {
      position: absolute;
      left: 20px;
      top: 20px;
      display: grid;
      gap: 6px;
      max-width: min(340px, calc(100vw - 40px));
      padding: 14px 16px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 14px;
      background: rgba(8,10,13,.78);
      backdrop-filter: blur(10px);
      color: #e8ebef;
      font-size: 13px;
      line-height: 1.4;
    }
    .phase5-panel strong { font-size: 15px; }
    .phase5-panel .status { opacity: .82; }
    @media (max-width: 640px) {
      .phase5-panel { left: 12px; top: 12px; }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Rubik phase 5 manual interaction preview">
    <div id="cube" class="cube-viewport"></div>
    <aside class="phase5-panel">
      <strong>Phase 5 — Manual Interaction</strong>
      <span>Drag any sticker on a center, edge, or corner; the face follows your drag.</span>
      <span>Release after roughly half a turn to snap 90°; release earlier to return.</span>
      <span>Drag empty space to rotate the Rubik itself.</span>
      <span>Wheel / touchpad = zoom.</span>
      <span id="status" class="status">Ready</span>
    </aside>
  </main>

  <script type="module">
    import { createSolvedCube } from '../src/core/cube.js';
    import { CubeTurnRuntime } from '../src/animation/cube-turn-runtime.js';
    import { RubikRenderer } from '../src/render/cube-renderer.js';
    import { FaceTurnRenderAdapter } from '../src/render/face-turn-renderer.js';
    import { ManualInteractionController } from '../src/interaction/manual-controller.js';

    const renderer = new RubikRenderer(document.querySelector('#cube'));
    const adapter = new FaceTurnRenderAdapter(renderer);
    const runtime = new CubeTurnRuntime({
      cubeState: createSolvedCube(),
      adapter,
      renderer
    });

    renderer.renderCube(runtime.cubeState);

    const status = document.querySelector('#status');

    const interaction = new ManualInteractionController({
      domElement: renderer.renderer.domElement,
      cameraController: renderer.cameraController,
      cubeOrientationController: renderer.cubeOrientationController,
      pickFace: (x, y) => renderer.pickFace(x, y),
      beginInteractive: move => runtime.beginInteractive(move),
      updateInteractive: progress => runtime.updateInteractive(progress),
      endInteractive: options => runtime.endInteractive(options),
      isInputLocked: () => runtime.busy,
      onGesture: event => {
        if (event.type === 'face-drag') {
          status.textContent = `Drag: ${event.turn.axis.toUpperCase()}${event.turn.layer > 0 ? '+' : event.turn.layer < 0 ? '-' : '0'} • ${Math.round(event.progress * 90)}°`;
        } else if (event.type === 'cube-rotate') {
          status.textContent = 'Cube rotation';
        }
      }
    });

    let previous = performance.now();
    function frame(now) {
      const delta = Math.min(50, now - previous);
      previous = now;
      const result = runtime.tick(delta);
      if (result.completed) {
        status.textContent = result.completed ? `Turn complete: ${result.completed.axis.toUpperCase()}${result.completed.layer > 0 ? '+' : result.completed.layer < 0 ? '-' : '0'}` : 'Ready';
      } else if (!runtime.busy) {
        status.textContent = 'Ready';
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    window.addEventListener('beforeunload', () => {
      interaction.dispose();
      renderer.dispose();
    });
  </script>
</body>
</html>
